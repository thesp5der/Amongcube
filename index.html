<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Among Cube</title>
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#05060a;overflow:hidden;touch-action:none;font-family:system-ui,sans-serif;color:#fff;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:140px;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 0;font-size:13px;opacity:.8;pointer-events:none;text-shadow:0 1px 2px #000}
#stick{position:fixed;left:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);display:none}
#knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.55)}
.touch #stick{display:block}
#sprint{position:fixed;right:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4);display:none;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff}
#sprint.on{background:rgba(255,200,0,.55)}
.touch #sprint{display:flex}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:rgba(0,0,0,.5);font-size:18px;line-height:1.5;padding:20px}
#pause{position:fixed;top:calc(env(safe-area-inset-top,0px) + 84px);right:12px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4);color:#fff;font-size:18px;line-height:1;padding:0}
#menu,#lobby{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:radial-gradient(circle at 50% 40%,#1b2238,#05060a 75%);padding:20px;text-align:center}
#menu h1{margin:0;font-size:clamp(40px,13vw,96px);letter-spacing:4px;color:#fff;text-shadow:0 4px 16px rgba(0,0,0,.6)}
#menu svg{width:clamp(110px,32vw,170px);height:auto}
#start,#restart,#host,#join,#jgo,#lleave,#lstart{font-family:'Amatic SC',cursive;font-weight:700;font-size:48px;color:#fff;background:#c51111;border:3px solid #fff;border-radius:14px;padding:6px 44px;cursor:pointer}
#restart{margin-top:18px;font-size:36px}
#menu,#lobby{visibility:hidden;pointer-events:none}
#jin{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);visibility:visible;pointer-events:auto}
#mini{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:12px;width:120px;height:66px;border:2px solid rgba(255,255,255,.5);border-radius:6px;background:rgba(0,0,0,.4);pointer-events:none}
body.ui #mini,body.ui #stick,body.ui #sprint,body.ui #pause,body.ui #cross,body.ui #hud{display:none!important}
#host,#join,#jgo,#lleave,#lstart{font-size:36px;padding:4px 30px}
.row{display:flex;gap:14px}
#lt{margin:0;font-size:clamp(24px,7vw,40px);letter-spacing:4px}
#lcode{font-size:clamp(56px,20vw,120px);letter-spacing:12px;font-weight:700;color:#fff}
#ls{margin:0;min-height:1.4em;opacity:.9}
#jin{font-size:40px;width:6ch;text-align:center;text-transform:uppercase;letter-spacing:8px;border-radius:12px;border:3px solid #fff;background:rgba(255,255,255,.1);color:#fff;padding:6px;-webkit-user-select:text;user-select:text}
@media (max-height:480px){#menu svg{display:none}}
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.6);pointer-events:none}
</style>
</head>
<body>
<div id="hud">Among Cube — find the crewmates</div>
<div id="cross"></div>
<canvas id="mini" width="120" height="66"></canvas>
<button id="sprint" type="button" aria-label="Sprint">SPRINT</button>
<button id="pause" type="button" aria-label="Pause">❚❚</button>
<div id="stick"><div id="knob"></div></div>
<div id="msg" style="display:none"><div></div></div>
<div id="menu">
<h1>AMONG CUBE</h1>
<svg viewBox="0 0 120 140" aria-label="Crewmate"><rect x="12" y="52" width="24" height="52" rx="6" fill="#8f0d0d"/><rect x="28" y="16" width="70" height="100" rx="14" fill="#c51111"/><rect x="34" y="108" width="24" height="26" rx="5" fill="#c51111"/><rect x="68" y="108" width="24" height="26" rx="5" fill="#c51111"/><rect x="52" y="36" width="52" height="30" rx="15" fill="#9fe4ff"/></svg>
<button id="start" type="button">Start?</button>
<div class="row"><button id="host" type="button">Host</button><button id="join" type="button">Join</button></div>
</div>
<div id="lobby" style="display:none">
<h2 id="lt"></h2>
<div id="lcode"></div>
<input id="jin" maxlength="4" autocomplete="off" autocapitalize="characters" placeholder="CODE" style="display:none">
<p id="ls"></p>
<button id="lstart" type="button" style="display:none">Start</button>
<button id="jgo" type="button" style="display:none">Join</button>
<button id="lleave" type="button">Back</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const BASE=[
"####################",
"#.......#..........#",
"#.......#..........#",
"#..................#",
"#.......#..........#",
"####.#######.#######",
"#......#.....#.....#",
"#......#.....#.....#",
"#..................#",
"#......#.....#.....#",
"####################"];
let MAP=BASE;const COLS=BASE[0].length,ROWS=BASE.length;
const S=4,H=3,R=0.35,EYE=0.8;
const isWall=(x,z)=>{const c=Math.floor(x/S),r=Math.floor(z/S);return !MAP[r]||MAP[r][c]!=='.';};
const hits=(x,z,r=R)=>isWall(x-r,z-r)||isWall(x+r,z-r)||isWall(x-r,z+r)||isWall(x+r,z+r);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x8497b8);
scene.fog=new THREE.Fog(0x8497b8,25,80);
const cam=new THREE.PerspectiveCamera(75,1,0.1,100);
cam.rotation.order='YXZ';
scene.add(cam);
scene.add(new THREE.AmbientLight(0xffffff,.75));
const lamp=new THREE.PointLight(0xffffff,.45,22);
cam.add(lamp);

// floor + ceiling
const W=MAP[0].length*S,D=MAP.length*S;
const floor=new THREE.Mesh(new THREE.PlaneGeometry(W,D),new THREE.MeshLambertMaterial({color:0x9aa1b0}));
floor.rotation.x=-Math.PI/2;floor.position.set(W/2,0,D/2);scene.add(floor);
const ceil=new THREE.Mesh(new THREE.PlaneGeometry(W,D),new THREE.MeshLambertMaterial({color:0xc9d0de}));
ceil.rotation.x=Math.PI/2;ceil.position.set(W/2,H,D/2);scene.add(ceil);

// walls
const wallMat=new THREE.MeshLambertMaterial({color:0x9fb2d6});
const wallGeo=new THREE.BoxGeometry(S,H,S);
let walls=null;const m4=new THREE.Matrix4();
function buildWalls(){
  if(walls){scene.remove(walls);walls.dispose();}
  const pos=[];MAP.forEach((row,r)=>[...row].forEach((ch,c)=>{if(ch==='#')pos.push([c,r]);}));
  walls=new THREE.InstancedMesh(wallGeo,wallMat,pos.length);
  pos.forEach(([c,r],i)=>walls.setMatrixAt(i,m4.makeTranslation(c*S+S/2,H/2,r*S+S/2)));
  walls.frustumCulled=false; // r128 culls by the single base box at the origin
  scene.add(walls);
}
// minimap: a 2D canvas of the current map + you
const mini=document.getElementById('mini'),mc=mini.getContext('2d'),MS=6;let miniImg=null;
function setMap(rows){
  MAP=rows;buildWalls();
  miniImg=document.createElement('canvas');miniImg.width=COLS*MS;miniImg.height=ROWS*MS;
  const x=miniImg.getContext('2d');
  MAP.forEach((row,r)=>[...row].forEach((ch,c)=>{x.fillStyle=ch==='#'?'#9fb2d6':'#1b2238';x.fillRect(c*MS,r*MS,MS,MS);}));
}
function drawMini(){
  mc.drawImage(miniImg,0,0);
  mc.fillStyle='#22c55e';tasks.forEach(t=>{if(!t.userData.done)mc.fillRect(t.position.x/S*MS-2,t.position.z/S*MS-2,4,4);});
  const dot=(g,col,r)=>{mc.fillStyle=col;mc.beginPath();mc.arc(g.x/S*MS,g.z/S*MS,r,0,6.283);mc.fill();};
  const hex=c=>'#'+c.toString(16).padStart(6,'0');
  crew.forEach(g=>dot(g.position,hex(colors[g.userData.i%colors.length]),2));          // other crewmates (roles stay hidden)
  peers.forEach((v,id)=>{dot(v.g.position,hex(colors[id%colors.length]),3);mc.strokeStyle='#fff';mc.stroke();}); // other players: bigger, outlined
  mc.strokeStyle=mc.fillStyle='#ffd400';dot(p,'#ffd400',3);                                // you, with a facing line
  const x=p.x/S*MS,z=p.z/S*MS;mc.beginPath();mc.moveTo(x,z);mc.lineTo(x-Math.sin(p.yaw)*8,z-Math.cos(p.yaw)*8);mc.stroke();
}
// random map: flip some interior walls/floors of the base model, keeping every floor reachable
const SAFE=()=>[...spots,[1,3]]; // crew spawns + player start must stay floor
function connected(g){
  let floors=0;g.forEach(r=>r.forEach(ch=>{if(ch==='.')floors++;}));
  const seen=new Set([3*COLS+1]),q=[[1,3]];
  while(q.length){const [c,r]=q.pop();for(const [dc,dr] of [[1,0],[-1,0],[0,1],[0,-1]]){
    const nc=c+dc,nr=r+dr,k=nr*COLS+nc;if(g[nr]&&g[nr][nc]==='.'&&!seen.has(k)){seen.add(k);q.push([nc,nr]);}}}
  return seen.size===floors;
}
function genMap(){
  const g=BASE.map(r=>[...r]),keep=new Set(SAFE().map(([c,r])=>r*COLS+c));
  for(let n=0,flips=0;n<400&&flips<14;n++){
    const c=1+Math.random()*(COLS-2)|0,r=1+Math.random()*(ROWS-2)|0;
    if(keep.has(r*COLS+c))continue;
    const old=g[r][c];g[r][c]=old==='#'?'.':'#';
    if(connected(g))flips++;else g[r][c]=old;
  }
  return g.map(r=>r.join(''));
}
const validMap=m=>Array.isArray(m)&&m.length===ROWS&&m.every(r=>typeof r==='string'&&r.length===COLS&&/^[#.]+$/.test(r))&&SAFE().every(([c,r])=>m[r][c]==='.');
function genTasks(map){
  const keep=new Set(SAFE().map(([c,r])=>r*COLS+c)),f=[];
  map.forEach((row,r)=>[...row].forEach((ch,c)=>{if(ch==='.'&&!keep.has(r*COLS+c))f.push([c,r]);}));
  for(let i=f.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[f[i],f[j]]=[f[j],f[i]];}
  return f.slice(0,5);
}
const validTasks=(t,map)=>Array.isArray(t)&&t.length<=8&&t.every(a=>Array.isArray(a)&&Number.isInteger(a[0])&&Number.isInteger(a[1])&&!!map[a[1]]&&map[a[1]][a[0]]==='.');
setMap(BASE);

// crewmate cubes
const colors=[0xc51111,0x132ed1,0x117f2d,0xed54ba,0xf5f557,0xef7d0e];
const spots=[[2,1],[6,2],[15,1],[16,3],[2,3],[10,3],[3,7],[10,8],[16,7],[9,8]];
const crew=[];
const hitCrew=(x,z,r,self)=>crew.some(g=>g!==self&&Math.hypot(g.position.x-x,g.position.z-z)<r+0.5)||(self&&Math.hypot(p.x-x,p.z-z)<r+R);
let impLeft=2;const tasks=[];
const pickImp=()=>{const s=new Set();while(s.size<2)s.add(Math.random()*spots.length|0);return s;};
function label(text,color){
  const c=document.createElement('canvas');c.width=256;c.height=64;
  const x=c.getContext('2d');x.fillStyle='rgba(0,0,0,.7)';x.fillRect(0,0,256,64);
  x.fillStyle=color;x.font='bold 36px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(text,128,34);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),fog:false}));
  s.scale.set(1.6,0.4,1);s.position.y=1.7;return s;
}
function makeCube(col){
  const g=new THREE.Group();
  const body=new THREE.Mesh(new THREE.BoxGeometry(0.9,1.2,0.7),new THREE.MeshLambertMaterial({color:col}));
  body.position.y=0.6;
  const visor=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.35,0.15),new THREE.MeshBasicMaterial({color:0x9fe4ff}));
  visor.position.set(0,0.8,0.38);
  const pack=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.7,0.25),new THREE.MeshLambertMaterial({color:col}));
  pack.position.set(0,0.6,-0.45);
  g.add(body,visor,pack);return g;
}
function spawn(imp){ // imp = Set of spot indices; clients pass an empty Set (roles stay hidden until ejected)
  crew.forEach(g=>scene.remove(g));crew.length=0;impLeft=2;
  spots.forEach(([c,r],i)=>{
    const g=makeCube(colors[i%colors.length]);
    g.position.set(c*S+S/2,0,r*S+S/2);g.rotation.y=Math.random()*6.28;
    Object.assign(g.userData,{i,role:imp.has(i)?'impostor':'crewmate',t:0,timer:Math.random()*2,moving:false,dir:0,gx:g.position.x,gz:g.position.z});
    scene.add(g);crew.push(g);
  });
}
spawn(pickImp());

const hud=document.getElementById('hud');
const upd=()=>{hud.textContent='Impostors: '+impLeft+' · Crewmates: '+(crew.length-impLeft)+' · Tasks: '+tasks.filter(t=>t.userData.done).length+'/'+tasks.length+' · tap to eject';};
upd();

// player
const p={x:1.5*S,z:3.5*S,yaw:-Math.PI/2,pitch:0};
let jx=0,jy=0;

function resize(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

// pause (touch GUI): button pauses, tap the overlay to resume
const msg=document.getElementById('msg'),menu=document.getElementById('menu');
let over=false;
const showMsg=(t,sub,c)=>{msg.firstElementChild.innerHTML='<b style="font-size:clamp(28px,9vw,48px);letter-spacing:4px;color:'+(c||'#fff')+'">'+t+'</b>'+(sub?'<br>'+sub:'')+(net.code&&net.id!==net.host?'<br>Waiting for the host…':'<br><button id="restart" type="button">Restart</button>');msg.style.display='';};
document.getElementById('start').addEventListener('click',()=>begin(pickImp()));
msg.addEventListener('click',e=>{if(e.target.id==='restart')return restart();if(!over)msg.style.display='none';});
document.getElementById('pause').addEventListener('click',()=>showMsg('PAUSED'));

// ---- multiplayer lobby ----
const SERVER='wss://amongcube.onrender.com'; // <- paste your Render URL here (wss://, no path)
const L=id=>document.getElementById(id);
let ws=null;const tx=o=>{if(ws&&ws.readyState===1)ws.send(JSON.stringify(o));};
const net={code:null,id:null,host:null,players:new Set()};
function lobby(title,code,status,input,bad){
  L('lobby').style.display='flex';
  L('lt').textContent=title;L('lcode').textContent=code||'';
  const s=L('ls');s.textContent=status||'';s.style.color=bad?'#ff6b6b':'';
  L('jin').style.display=L('jgo').style.display=input?'':'none';
  L('lstart').style.display=code&&net.id===net.host?'':'none';
}
function leave(){
  if(ws){ws.onopen=ws.onmessage=ws.onclose=null;ws.close();ws=null;}
  net.code=net.id=net.host=null;net.players.clear();
}
const room=()=>lobby('ROOM CODE',net.code,'Players: '+net.players.size+(net.id===net.host?' · you are the host':''));
function connect(first){
  lobby('CONNECTING…','','The server can take up to a minute to wake up');
  let sock;
  try{sock=ws=new WebSocket(SERVER);}catch(e){return lobby('CONNECTION FAILED','','Bad server address',false,true);}
  const t=setTimeout(()=>{if(sock.readyState!==1)sock.close();},60000);
  sock.onopen=()=>{clearTimeout(t);sock.send(JSON.stringify(first));};
  sock.onmessage=e=>{
    let m;try{m=JSON.parse(e.data);}catch{return;}
    if(m.t==='room'){net.code=m.code;net.id=m.id;net.host=m.host;net.players=new Set(m.players);room();}
    else if(m.t==='err'&&!net.code)lobby('JOIN A ROOM','',m.m,true,true);
    else if(m.t==='joined'){net.players.add(m.id);room();}
    else if(m.t==='left'){net.players.delete(m.id);room();}
    else if(m.t==='newhost'){net.host=m.id;room();}
    gameMsg(m);
  };
  sock.onclose=()=>{
    clearTimeout(t);if(ws!==sock)return;
    const had=net.code;leave();
    lobby('CONNECTION FAILED','',had?'Connection lost':'Could not reach the server. It may be waking up, try again in a minute.',false,true);
  };
}
L('host').onclick=()=>connect({t:'host'});
L('join').onclick=()=>{lobby('JOIN A ROOM','','',true);L('jin').value='';L('jin').focus();};
L('jgo').onclick=()=>{
  const c=L('jin').value.toUpperCase().replace(/[^A-Z]/g,'');
  if(c.length!==4)return lobby('JOIN A ROOM','','Enter the 4-letter room code',true,true);
  const m={t:'join',code:c};
  if(ws&&ws.readyState===1)ws.send(JSON.stringify(m));else connect(m);
};
L('jin').onkeydown=e=>{if(e.key==='Enter')L('jgo').click();};
L('lleave').onclick=()=>{leave();toMenu();};
L('lstart').onclick=()=>newRound();
// ---- end lobby ----
// ---- 3D UI: a skin over the hidden DOM menu/lobby (the DOM stays the source of truth; 3D buttons click it) ----
const uiScene=new THREE.Scene(),uiCam=new THREE.PerspectiveCamera(50,1,.1,100),uiRoot=new THREE.Group(),uray=new THREE.Raycaster(),uiQ=new THREE.Vector3();
uiScene.background=new THREE.Color(0x34456a);
const uiSun=new THREE.DirectionalLight(0xffffff,.8);uiSun.position.set(3,6,8);
uiScene.add(new THREE.AmbientLight(0xffffff,.8),uiSun,uiRoot);
function uiFit(){ // fit an 8 x 14 unit layout to any screen
  const t=Math.tan(25*Math.PI/180);uiCam.aspect=innerWidth/innerHeight;
  uiCam.position.set(0,0,Math.max(14/(2*t),8/(2*t*uiCam.aspect)));uiCam.updateProjectionMatrix();
}
addEventListener('resize',uiFit);uiFit();
const uiUp=()=>menu.style.display!=='none'||L('lobby').style.display!=='none';
let uiHits=[],uiSpin=[],uiKey='';
const mats={},boxes={},UNIT=new THREE.BoxGeometry(.92,.92,1),G={};
const mat=c=>mats[c]||(mats[c]=new THREE.MeshLambertMaterial({color:c}));
const box=(w,h,d)=>boxes[[w,h,d]]||(boxes[[w,h,d]]=new THREE.BoxGeometry(w,h,d));
// 5x7 voxel font: every lit pixel is a real cube
'A 01110 10001 10001 11111 10001 10001 10001|B 11110 10001 10001 11110 10001 10001 11110|C 01110 10001 10000 10000 10000 10001 01110|D 11110 10001 10001 10001 10001 10001 11110|E 11111 10000 10000 11110 10000 10000 11111|F 11111 10000 10000 11110 10000 10000 10000|G 01110 10001 10000 10111 10001 10001 01111|H 10001 10001 10001 11111 10001 10001 10001|I 01110 00100 00100 00100 00100 00100 01110|J 00111 00010 00010 00010 00010 10010 01100|K 10001 10010 10100 11000 10100 10010 10001|L 10000 10000 10000 10000 10000 10000 11111|M 10001 11011 10101 10101 10001 10001 10001|N 10001 11001 10101 10011 10001 10001 10001|O 01110 10001 10001 10001 10001 10001 01110|P 11110 10001 10001 11110 10000 10000 10000|Q 01110 10001 10001 10001 10101 10010 01101|R 11110 10001 10001 11110 10100 10010 10001|S 01111 10000 10000 01110 00001 00001 11110|T 11111 00100 00100 00100 00100 00100 00100|U 10001 10001 10001 10001 10001 10001 01110|V 10001 10001 10001 10001 10001 01010 00100|W 10001 10001 10001 10101 10101 11011 10001|X 10001 10001 01010 00100 01010 10001 10001|Y 10001 10001 01010 00100 00100 00100 00100|Z 11111 00001 00010 00100 01000 10000 11111|0 01110 10001 10011 10101 11001 10001 01110|1 00100 01100 00100 00100 00100 00100 01110|2 01110 10001 00001 00010 00100 01000 11111|3 11110 00001 00001 01110 00001 00001 11110|4 00010 00110 01010 10010 11111 00010 00010|5 11111 10000 11110 00001 00001 10001 01110|6 00110 01000 10000 11110 10001 10001 01110|7 11111 00001 00010 00100 01000 01000 01000|8 01110 10001 10001 01110 10001 10001 01110|9 01110 10001 10001 01111 00001 00010 01100|? 01110 10001 00001 00110 00100 00000 00100|! 00100 00100 00100 00100 00100 00000 00100|. 00000 00000 00000 00000 00000 01100 01100|: 00000 01100 01100 00000 01100 01100 00000|- 00000 00000 00000 11111 00000 00000 00000|< 00010 00100 01000 10000 01000 00100 00010'.split('|').forEach(l=>{const[c,...r]=l.split(' ');G[c]=r;});
function vtext(str,px,color,depth=2,maxW=7.6){
  str=String(str).toUpperCase().replace(/·/g,'-').replace(/…/g,'...');
  const cols=Math.max(1,str.length*6-1);px=Math.min(px,maxW/cols);
  const cells=[];[...str].forEach((ch,n)=>(G[ch]||[]).forEach((row,y)=>[...row].forEach((b,x)=>{if(b==='1')cells.push([n*6+x,y]);})));
  const g=new THREE.Group();if(!cells.length)return g;
  const m=new THREE.InstancedMesh(UNIT,mat(color),cells.length),t=new THREE.Matrix4();
  cells.forEach(([x,y],i)=>m.setMatrixAt(i,t.makeTranslation(x-(cols-1)/2,3-y,0)));
  m.scale.set(px,px,px*depth);m.frustumCulled=false;g.add(m);return g;
}
function vlines(str,px,color,maxChars){ // word-wrapped voxel text, top-anchored
  const lines=[];let cur='';
  String(str).split(' ').forEach(w=>{if(cur&&(cur+' '+w).length>maxChars){lines.push(cur);cur=w;}else cur=(cur+' '+w).trim();});
  if(cur)lines.push(cur);
  const g=new THREE.Group(),q=Math.min(px,7.6/(maxChars*6-1));
  lines.forEach((l,i)=>{const t=vtext(l,q,color);t.position.y=-i*9*q;g.add(t);});
  return g;
}
function ubtn(label,w,h,x,y,fn,color){ // 3D button: a box with cube text on its face
  const g=new THREE.Group(),b=new THREE.Mesh(box(w,h,.6),mat(color));
  b.userData={fn,label};
  const t=vtext(label,h*.7/7,0xffffff,2,w*.85);t.position.z=.3;
  g.add(b,t);g.position.set(x,y,0);uiRoot.add(g);uiHits.push(b);
}
function ucrew(scale,y){ // the same crewmate cube players use in the game
  const g=makeCube(0xc51111);g.scale.setScalar(scale);g.position.y=y-.6*scale;uiRoot.add(g);uiSpin.push(g);
}
function uiBuild(v){
  uiRoot.traverse(o=>{if(o.isInstancedMesh)o.dispose();});
  while(uiRoot.children.length)uiRoot.remove(uiRoot.children[0]);
  uiHits=[];uiSpin=[];
  const put=(o,x,y,z=0)=>{o.position.set(x,y,z);uiRoot.add(o);return o;};
  if(v==='menu'){
    put(vtext('AMONG',.24,0xffffff,3),0,5.6);put(vtext('CUBE',.24,0xffffff,3),0,3.7);
    ucrew(2.2,-.2);
    ubtn('START?',5,1.5,0,-3.5,()=>L('start').click(),0xc51111);
    ubtn('HOST',3.4,1.2,-1.8,-5.4,()=>L('host').click(),0x132ed1);
    ubtn('JOIN',3.4,1.2,1.8,-5.4,()=>L('join').click(),0x117f2d);
    return;
  }
  const tone=v.bad?0xff6b6b:0xdddddd;
  put(vlines(v.t,.16,0xffffff,11),0,6.4);
  if(v.inp){ // JOIN tab: the real <input> sits under the title and the phone keyboard types the code
    put(vlines(v.s,.1,tone,16),0,2.8);
    ubtn('JOIN',4,1.2,0,.6,()=>L('jgo').click(),0x117f2d);
    ubtn('BACK',3,1,0,-1.2,()=>L('lleave').click(),0x555b6e);
    return;
  }
  if(v.c){put(vtext(v.c,.3,0xffffff,3),0,3.8);ucrew(1.2,1);} // HOST/room tab
  put(vlines(v.s,.12,tone,11),0,v.c?-.7:2.2);
  if(v.st)ubtn('START',4,1.2,0,-4,()=>L('lstart').click(),0xc51111);
  ubtn('BACK',3,1,0,v.c?-5.6:-5.4,()=>L('lleave').click(),0x555b6e);
}
function uiFrame(now){
  const lob=L('lobby').style.display!=='none';
  const v=lob?{t:L('lt').textContent,c:L('lcode').textContent,s:L('ls').textContent,bad:!!L('ls').style.color,inp:L('jin').style.display!=='none',st:L('lstart').style.display!=='none'}:'menu';
  const key=JSON.stringify(v);if(key!==uiKey){uiKey=key;uiBuild(v);}
  uiSpin.forEach(g=>{g.rotation.y=now/1000;});
  renderer.render(uiScene,uiCam);
  if(v.inp)L('jin').style.top=(1-uiQ.set(0,4,0).project(uiCam).y)/2*innerHeight+'px'; // park the input in the 3D gap
}
function uiTap(x,y){
  uray.setFromCamera({x:x/innerWidth*2-1,y:1-y/innerHeight*2},uiCam);
  const h=uray.intersectObjects(uiHits)[0];if(h)h.object.userData.fn();
}
// ---- end 3D UI ----

// touch: left = joystick, right = look
const sprintBtn=document.getElementById('sprint');
const stick=document.getElementById('stick'),knob=document.getElementById('knob');
const taps={};
let sprintId=null,sprintOn=false,moveId=null,lookId=null,sx=0,sy=0,lx=0,ly=0;
addEventListener('touchstart',e=>{
  document.body.classList.add('touch');
  for(const t of e.changedTouches){
    if(t.target.closest&&t.target.closest('#sprint')){sprintId=t.identifier;sprintOn=true;sprintBtn.classList.add('on');continue;}
    if(t.target.closest&&t.target.closest('#pause,#start,#restart,#menu,#lobby'))continue;
    taps[t.identifier]=[t.clientX,t.clientY,performance.now()];
    if(t.clientX<innerWidth/2&&moveId===null){moveId=t.identifier;sx=t.clientX;sy=t.clientY;
      stick.style.left=(sx-60)+'px';stick.style.bottom='auto';stick.style.top=(sy-60)+'px';}
    else if(lookId===null){lookId=t.identifier;lx=t.clientX;ly=t.clientY;}
  }
},{passive:false});
addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===moveId){
      let dx=t.clientX-sx,dy=t.clientY-sy;const m=Math.hypot(dx,dy),max=50;
      if(m>max){dx*=max/m;dy*=max/m;}
      jx=dx/max;jy=dy/max;
      knob.style.left=(40+dx)+'px';knob.style.top=(40+dy)+'px';
    }else if(t.identifier===lookId){
      p.yaw-=(t.clientX-lx)*0.006;
      p.pitch=Math.max(-1.2,Math.min(1.2,p.pitch-(t.clientY-ly)*0.006));
      lx=t.clientX;ly=t.clientY;
    }
  }
},{passive:false});
function endT(e){
  for(const t of e.changedTouches){
    const a=taps[t.identifier];delete taps[t.identifier];
    if(a&&e.type==='touchend'&&performance.now()-a[2]<250&&Math.hypot(t.clientX-a[0],t.clientY-a[1])<12)tapEject(t.clientX,t.clientY);
    if(t.identifier===moveId){moveId=null;jx=jy=0;knob.style.left='40px';knob.style.top='40px';
      stick.style.left='24px';stick.style.top='auto';stick.style.bottom='calc(env(safe-area-inset-bottom,0px) + 24px)';}
    if(t.identifier===lookId)lookId=null;
    if(t.identifier===sprintId){sprintId=null;sprintOn=false;sprintBtn.classList.remove('on');}
  }
}
addEventListener('touchend',endT);addEventListener('touchcancel',endT);

const ray=new THREE.Raycaster();ray.far=8;
const frozen=()=>menu.style.display!=='none'||msg.style.display!=='none'||L('lobby').style.display!=='none';
const sim=()=>!net.code||net.id===net.host; // solo or room host: runs the AI + rules
const peers=new Map();let inGame=false,lastSend=0,lastNpc=0;
const num=v=>typeof v==='number'&&isFinite(v);

function tapEject(x,y){
  if(uiUp())return uiTap(x,y);
  if(frozen()||!inGame)return;
  ray.setFromCamera({x:0,y:0},cam);
  let o=(ray.intersectObjects([walls,...crew,...tasks],true)[0]||{}).object;
  while(o&&o.parent&&o.parent!==scene)o=o.parent;
  if(tasks.includes(o)){const i=o.userData.i;if(!o.userData.done){if(sim())hostTask(i);else tx({t:'req',k:'task',i});}return;}
  if(!crew.includes(o))return;
  if(sim())hostEject(o.userData.i);else tx({t:'req',k:'eject',i:o.userData.i});
}
const TB=new THREE.BoxGeometry(1,1,1),TT=new THREE.BoxGeometry(.7,.15,.7);
function spawnTasks(cells){
  tasks.forEach(t=>scene.remove(t));tasks.length=0;
  cells.forEach(([c,r],i)=>{
    const g=new THREE.Group(),body=new THREE.MeshLambertMaterial({color:0x22c55e}),top=new THREE.MeshBasicMaterial({color:0xbbf7d0});
    const b=new THREE.Mesh(TB,body),t=new THREE.Mesh(TT,top);b.position.y=.5;t.position.y=1.08;
    const lab=label('TASK','#7dffa0');g.add(b,t,lab);
    g.userData={i,done:false,body,top,lab};g.position.set(c*S+S/2,0,r*S+S/2);scene.add(g);tasks.push(g);
  });
}
function applyTask(i){
  const g=tasks.find(t=>t.userData.i===i);if(!g||g.userData.done)return;
  const u=g.userData;u.done=true;u.body.color.set(0x6b7280);u.top.color.set(0x9ca3af);
  g.remove(u.lab);u.lab=label('DONE','#9ca3af');g.add(u.lab);upd();
}
function hostTask(i){if(over)return;if(net.code)tx({t:'ev',k:'task',i});applyTask(i);}
function applyEject(i,role){ // everyone: reveal the role, then remove the cube
  const g=crew.find(c=>c.userData.i===i);if(!g)return;
  crew.splice(crew.indexOf(g),1);
  if(role==='impostor')impLeft--;
  g.add(label(role==='impostor'?'IMPOSTOR':'CREWMATE',role==='impostor'?'#ff4040':'#5cff7a'));
  upd();setTimeout(()=>scene.remove(g),800);
}
function hostEject(i){
  const g=crew.find(c=>c.userData.i===i);if(!g||over)return;
  const role=g.userData.role;
  if(net.code)tx({t:'ev',k:'eject',i,role});
  applyEject(i,role);
  const r=role!=='impostor'?'wrong':impLeft===0?'win':null;
  if(r)setTimeout(()=>hostEnd(r),800);
}
function showEnd(r){
  over=true;
  if(r==='win')showMsg('YOU WIN!','Both impostors ejected');
  else if(r==='wrong')showMsg('WRONG ONE!!!! RETRY?','','#ff4040');
  else showMsg('SLAUGHTERED! RETRY?','','#ff4040');
}
function hostEnd(r){if(over)return;if(net.code)tx({t:'ev',k:'end',r});showEnd(r);}
function begin(imp,map=genMap(),cells=genTasks(map)){
  setMap(map);spawn(imp);spawnTasks(cells);over=false;inGame=true;
  Object.assign(p,{x:1.5*S,z:3.5*S,yaw:-Math.PI/2,pitch:0});
  peers.forEach(v=>{v.x=p.x;v.z=p.z;}); // stale positions from the last round must not touch the new impostors
  msg.style.display=menu.style.display=L('lobby').style.display='none';
  L('pause').style.display=net.code?'none':''; // no pausing in a room: it would freeze the host's AI for everyone
  upd();
}
function newRound(){if(!sim())return;const map=genMap(),cells=genTasks(map);begin(pickImp(),map,cells);if(net.code)tx({t:'ev',k:'start',map,tasks:cells});}
function toMenu(){
  inGame=over=false;peers.forEach(v=>scene.remove(v.g));peers.clear();
  msg.style.display=L('lobby').style.display='none';menu.style.display='';L('pause').style.display='';
}
function gameMsg(m){ // everything that arrives from the server (peers' data is untrusted)
  if(m.t==='ev'){
    if(m.k==='start'){const mp=validMap(m.map)?m.map:BASE;begin(new Set(),mp,validTasks(m.tasks,mp)?m.tasks:[]);}
    else if(!inGame)return;
    else if(m.k==='npc'&&Array.isArray(m.d)){
      for(const a of m.d){
        const g=Array.isArray(a)&&crew.find(c=>c.userData.i===a[0]);
        if(g&&a.slice(1,4).every(num))Object.assign(g.userData,{gx:a[1],gz:a[2],dir:a[3],moving:!!a[4]});
      }
    }
    else if(m.k==='task'&&Number.isInteger(m.i))applyTask(m.i);
    else if(m.k==='eject'&&Number.isInteger(m.i))applyEject(m.i,m.role==='impostor'?'impostor':'crewmate');
    else if(m.k==='end'&&!over&&(m.r==='win'||m.r==='wrong'||m.r==='slain'))showEnd(m.r);
  }else if(m.t==='pos'&&inGame&&[m.x,m.z,m.yaw].every(num)){
    let v=peers.get(m.from);
    if(!v){
      const g=makeCube(colors[m.from%colors.length]);g.add(label('P'+m.from,'#ffffff'));
      g.position.set(m.x,0,m.z);scene.add(g);peers.set(m.from,v={g});
    }
    v.x=Math.max(0,Math.min(W,m.x));v.z=Math.max(0,Math.min(D,m.z));v.yaw=m.yaw;
  }else if(m.t==='req'&&inGame&&sim()&&Number.isInteger(m.i)){if(m.k==='eject')hostEject(m.i);else if(m.k==='task')hostTask(m.i);}
  else if(m.t==='left'){const v=peers.get(m.id);if(v){scene.remove(v.g);peers.delete(m.id);}}
  else if(m.t==='newhost'&&inGame){over=true;showMsg('HOST LEFT');} // new host gets a Restart button
}
const restart=()=>{if(net.code)return newRound();location.hash='restart';location.reload();};
if(location.hash==='#restart'){location.hash='';begin(pickImp());} // skip the menu after Restart

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  const ui=uiUp();document.body.classList.toggle('ui',ui);
  if(frozen()){if(ui)uiFrame(now);requestAnimationFrame(loop);return;} // paused: freeze everything
  let f=-jy,s=jx;
  const len=Math.hypot(f,s);if(len>1){f/=len;s/=len;}
  const sp=(sprintOn?9:5)*dt,sy_=Math.sin(p.yaw),cy=Math.cos(p.yaw);
  const dx=(-sy_*f+cy*s)*sp,dz=(-cy*f-sy_*s)*sp;
  if(!hits(p.x+dx,p.z)&&!hitCrew(p.x+dx,p.z,R))p.x+=dx;
  if(!hits(p.x,p.z+dz)&&!hitCrew(p.x,p.z+dz,R))p.z+=dz;
  cam.position.set(p.x,EYE,p.z);
  cam.rotation.set(p.pitch,p.yaw,0);
  const host=sim(),targets=[p,...peers.values()];
  crew.forEach(g=>{
    const u=g.userData;
    if(!host){ // clients just follow the host's positions
      const k=Math.min(1,dt*12);g.position.x+=(u.gx-g.position.x)*k;g.position.z+=(u.gz-g.position.z)*k;
      if(u.moving){g.rotation.y=u.dir;u.t+=dt*10;g.position.y=Math.abs(Math.sin(u.t))*0.08;}else g.position.y=0;
      return;
    }
    u.timer-=dt;
    if(u.timer<=0){u.moving=Math.random()<0.75;u.dir=Math.random()*6.283;u.timer=1+Math.random()*3;}
    u.chase=false;
    if(u.role==='impostor'){
      let best=null,bd=6;
      for(const t of targets){const d=Math.hypot(t.x-g.position.x,t.z-g.position.z);if(d<1.2)return hostEnd('slain');if(d<bd){bd=d;best=t;}}
      if(best){u.dir=Math.atan2(best.x-g.position.x,best.z-g.position.z);u.moving=true;u.chase=true;}
    }
    if(!u.moving){g.position.y=0;return;}
    const nx=g.position.x+Math.sin(u.dir)*(u.chase?3:1.6)*dt,nz=g.position.z+Math.cos(u.dir)*(u.chase?3:1.6)*dt;
    let ok=false;
    if(!hits(nx,g.position.z,0.5)&&!hitCrew(nx,g.position.z,0.5,g)){g.position.x=nx;ok=true;}
    if(!hits(g.position.x,nz,0.5)&&!hitCrew(g.position.x,nz,0.5,g)){g.position.z=nz;ok=true;}
    if(!ok)u.timer=0;
    g.rotation.y=u.dir;u.t+=dt*10;g.position.y=Math.abs(Math.sin(u.t))*0.08;
  });
  if(net.code){
    if(now-lastSend>80){lastSend=now;tx({t:'pos',x:+p.x.toFixed(2),z:+p.z.toFixed(2),yaw:+p.yaw.toFixed(2)});}
    if(host&&now-lastNpc>100){lastNpc=now;tx({t:'ev',k:'npc',d:crew.map(g=>[g.userData.i,+g.position.x.toFixed(1),+g.position.z.toFixed(1),+g.rotation.y.toFixed(2),g.userData.moving?1:0])});}
  }
  const k=Math.min(1,dt*12);
  peers.forEach(v=>{v.g.position.x+=(v.x-v.g.position.x)*k;v.g.position.z+=(v.z-v.g.position.z)*k;v.g.rotation.y=v.yaw+Math.PI;});
  drawMini();
  renderer.render(scene,cam);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>

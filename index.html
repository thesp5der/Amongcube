<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Among Cube</title>
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#05060a;overflow:hidden;touch-action:none;font-family:system-ui,sans-serif;color:#fff;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 0;font-size:13px;opacity:.8;pointer-events:none;text-shadow:0 1px 2px #000}
#stick{position:fixed;left:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);display:none}
#knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.55)}
.touch #stick{display:block}
#sprint{position:fixed;right:24px;bottom:calc(env(safe-area-inset-bottom,0px) + 40px);width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4);display:none;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff}
#sprint.on{background:rgba(255,200,0,.55)}
.touch #sprint{display:flex}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:rgba(0,0,0,.5);font-size:18px;line-height:1.5;padding:20px}
#pause{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);right:12px;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4);color:#fff;font-size:18px;line-height:1;padding:0}
#menu{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;background:radial-gradient(circle at 50% 40%,#1b2238,#05060a 75%);padding:20px;text-align:center}
#menu h1{margin:0;font-size:clamp(40px,13vw,96px);letter-spacing:4px;color:#fff;text-shadow:0 4px 16px rgba(0,0,0,.6)}
#menu svg{width:clamp(110px,32vw,170px);height:auto}
#start,#restart{font-family:'Amatic SC',cursive;font-weight:700;font-size:48px;color:#fff;background:#c51111;border:3px solid #fff;border-radius:14px;padding:6px 44px;cursor:pointer}
#restart{margin-top:18px;font-size:36px}
#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:rgba(255,255,255,.6);pointer-events:none}
</style>
</head>
<body>
<div id="hud">Among Cube — find the crewmates</div>
<div id="cross"></div>
<button id="sprint" type="button" aria-label="Sprint">SPRINT</button>
<button id="pause" type="button" aria-label="Pause">❚❚</button>
<div id="stick"><div id="knob"></div></div>
<div id="msg" style="display:none"><div></div></div>
<div id="menu">
<h1>AMONG CUBE</h1>
<svg viewBox="0 0 120 140" aria-label="Crewmate"><rect x="12" y="52" width="24" height="52" rx="6" fill="#8f0d0d"/><rect x="28" y="16" width="70" height="100" rx="14" fill="#c51111"/><rect x="34" y="108" width="24" height="26" rx="5" fill="#c51111"/><rect x="68" y="108" width="24" height="26" rx="5" fill="#c51111"/><rect x="52" y="36" width="52" height="30" rx="15" fill="#9fe4ff"/></svg>
<button id="start" type="button">Start?</button>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
const MAP=[
"####################",
"#.......#..........#",
"#.......#..........#",
"#..................#",
"#.......#..........#",
"####.#######.#######",
"#......#.....#.....#",
"#......#.....#.....#",
"#..................#",
"#......#.....#.....#",
"####################"];
const S=4,H=3,R=0.35,EYE=0.8;
const isWall=(x,z)=>{const c=Math.floor(x/S),r=Math.floor(z/S);return !MAP[r]||MAP[r][c]!=='.';};
const hits=(x,z,r=R)=>isWall(x-r,z-r)||isWall(x+r,z-r)||isWall(x-r,z+r)||isWall(x+r,z+r);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xbfd4ee);
scene.fog=new THREE.Fog(0xbfd4ee,25,80);
const cam=new THREE.PerspectiveCamera(75,1,0.1,100);
cam.rotation.order='YXZ';
scene.add(cam);
scene.add(new THREE.AmbientLight(0xffffff,1.1));
const lamp=new THREE.PointLight(0xffffff,1,22);
cam.add(lamp);

// floor + ceiling
const W=MAP[0].length*S,D=MAP.length*S;
const floor=new THREE.Mesh(new THREE.PlaneGeometry(W,D),new THREE.MeshLambertMaterial({color:0x9aa1b0}));
floor.rotation.x=-Math.PI/2;floor.position.set(W/2,0,D/2);scene.add(floor);
const ceil=new THREE.Mesh(new THREE.PlaneGeometry(W,D),new THREE.MeshLambertMaterial({color:0xc9d0de}));
ceil.rotation.x=Math.PI/2;ceil.position.set(W/2,H,D/2);scene.add(ceil);

// walls
const wallMat=new THREE.MeshLambertMaterial({color:0x9fb2d6});
const wallGeo=new THREE.BoxGeometry(S,H,S);
const wallPos=[];
MAP.forEach((row,r)=>[...row].forEach((ch,c)=>{if(ch==='#')wallPos.push([c,r]);}));
const walls=new THREE.InstancedMesh(wallGeo,wallMat,wallPos.length),m4=new THREE.Matrix4();
wallPos.forEach(([c,r],i)=>walls.setMatrixAt(i,m4.makeTranslation(c*S+S/2,H/2,r*S+S/2)));
walls.frustumCulled=false; // r128 culls by the single base box at the origin
scene.add(walls);

// crewmate cubes
const colors=[0xc51111,0x132ed1,0x117f2d,0xed54ba,0xf5f557,0xef7d0e];
const spots=[[2,1],[6,2],[15,1],[16,3],[2,3],[10,3],[3,7],[10,8],[16,7],[9,8]];
const crew=[];
const hitCrew=(x,z,r,self)=>crew.some(g=>g!==self&&Math.hypot(g.position.x-x,g.position.z-z)<r+0.5)||(self&&Math.hypot(p.x-x,p.z-z)<r+R);
const imp=new Set();while(imp.size<2)imp.add(Math.floor(Math.random()*spots.length));
function label(text,color){
  const c=document.createElement('canvas');c.width=256;c.height=64;
  const x=c.getContext('2d');x.fillStyle='rgba(0,0,0,.7)';x.fillRect(0,0,256,64);
  x.fillStyle=color;x.font='bold 36px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(text,128,34);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),fog:false}));
  s.scale.set(1.6,0.4,1);s.position.y=1.7;return s;
}
spots.forEach(([c,r],i)=>{
  const g=new THREE.Group();
  const col=colors[i%colors.length];
  const body=new THREE.Mesh(new THREE.BoxGeometry(0.9,1.2,0.7),new THREE.MeshLambertMaterial({color:col}));
  body.position.y=0.6;
  const visor=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.35,0.15),new THREE.MeshBasicMaterial({color:0x9fe4ff}));
  visor.position.set(0,0.8,0.38);
  const pack=new THREE.Mesh(new THREE.BoxGeometry(0.6,0.7,0.25),new THREE.MeshLambertMaterial({color:col}));
  pack.position.set(0,0.6,-0.45);
  const bad=imp.has(i);
  g.userData.role=bad?'impostor':'crewmate';
  const lab=bad?label('IMPOSTOR','#ff4040'):label('CREWMATE','#5cff7a');
  lab.visible=false;lab.raycast=()=>{};g.userData.label=lab;
  g.add(body,visor,pack,lab);
  g.position.set(c*S+S/2,0,r*S+S/2);
  g.rotation.y=Math.random()*6.28;
  Object.assign(g.userData,{t:0,timer:Math.random()*2,moving:false,dir:0});
  scene.add(g);crew.push(g);
});

const hud=document.getElementById('hud');
const upd=()=>{hud.textContent='Impostors: '+crew.filter(g=>g.userData.role==='impostor').length+' · Crewmates: '+crew.filter(g=>g.userData.role!=='impostor').length+' · tap to eject';};
upd();

// player
const p={x:1.5*S,z:3.5*S,yaw:-Math.PI/2,pitch:0};
let jx=0,jy=0;

function resize(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

// pause (touch GUI): button pauses, tap the overlay to resume
const msg=document.getElementById('msg'),menu=document.getElementById('menu');
let over=false;
const showMsg=(t,sub,c)=>{msg.firstElementChild.innerHTML='<b style="font-size:clamp(28px,9vw,48px);letter-spacing:4px;color:'+(c||'#fff')+'">'+t+'</b>'+(sub?'<br>'+sub:'')+'<br><button id="restart" type="button">Restart</button>';msg.style.display='';};
document.getElementById('start').addEventListener('click',()=>{menu.style.display='none';});
msg.addEventListener('click',e=>{if(e.target.id==='restart')return restart();if(!over)msg.style.display='none';});
document.getElementById('pause').addEventListener('click',()=>showMsg('PAUSED'));

// touch: left = joystick, right = look
const sprintBtn=document.getElementById('sprint');
const stick=document.getElementById('stick'),knob=document.getElementById('knob');
const taps={};
let sprintId=null,sprintOn=false,moveId=null,lookId=null,sx=0,sy=0,lx=0,ly=0;
addEventListener('touchstart',e=>{
  document.body.classList.add('touch');
  for(const t of e.changedTouches){
    if(t.target.closest&&t.target.closest('#sprint')){sprintId=t.identifier;sprintOn=true;sprintBtn.classList.add('on');continue;}
    if(t.target.closest&&t.target.closest('#pause,#start,#restart'))continue;
    taps[t.identifier]=[t.clientX,t.clientY,performance.now()];
    if(t.clientX<innerWidth/2&&moveId===null){moveId=t.identifier;sx=t.clientX;sy=t.clientY;
      stick.style.left=(sx-60)+'px';stick.style.bottom='auto';stick.style.top=(sy-60)+'px';}
    else if(lookId===null){lookId=t.identifier;lx=t.clientX;ly=t.clientY;}
  }
},{passive:false});
addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===moveId){
      let dx=t.clientX-sx,dy=t.clientY-sy;const m=Math.hypot(dx,dy),max=50;
      if(m>max){dx*=max/m;dy*=max/m;}
      jx=dx/max;jy=dy/max;
      knob.style.left=(40+dx)+'px';knob.style.top=(40+dy)+'px';
    }else if(t.identifier===lookId){
      p.yaw-=(t.clientX-lx)*0.006;
      p.pitch=Math.max(-1.2,Math.min(1.2,p.pitch-(t.clientY-ly)*0.006));
      lx=t.clientX;ly=t.clientY;
    }
  }
},{passive:false});
function endT(e){
  for(const t of e.changedTouches){
    const a=taps[t.identifier];delete taps[t.identifier];
    if(a&&e.type==='touchend'&&performance.now()-a[2]<250&&Math.hypot(t.clientX-a[0],t.clientY-a[1])<12)tapEject();
    if(t.identifier===moveId){moveId=null;jx=jy=0;knob.style.left='40px';knob.style.top='40px';
      stick.style.left='24px';stick.style.top='auto';stick.style.bottom='calc(env(safe-area-inset-bottom,0px) + 24px)';}
    if(t.identifier===lookId)lookId=null;
    if(t.identifier===sprintId){sprintId=null;sprintOn=false;sprintBtn.classList.remove('on');}
  }
}
addEventListener('touchend',endT);addEventListener('touchcancel',endT);

const ray=new THREE.Raycaster();ray.far=8;
function tapEject(){
  if(menu.style.display!=='none'||msg.style.display!=='none')return;
  ray.setFromCamera({x:0,y:0},cam);
  let o=(ray.intersectObjects([walls,...crew],true)[0]||{}).object;
  while(o&&o.parent&&o.parent!==scene)o=o.parent;
  if(!crew.includes(o))return;
  crew.splice(crew.indexOf(o),1); // stops its AI + collision
  o.userData.label.visible=true;  // reveal role, then remove
  const bad=o.userData.role==='impostor';
  upd();
  setTimeout(()=>{
    scene.remove(o);
    if(over)return;
    if(!bad){over=true;showMsg('WRONG ONE!!!! RETRY?','','#ff4040');}
    else if(!crew.some(c=>c.userData.role==='impostor')){over=true;showMsg('YOU WIN!','Both impostors ejected');}
  },800);
}
const die=()=>{if(over)return;over=true;showMsg('SLAUGHTERED! RETRY?','','#ff4040');};
const restart=()=>{location.hash='restart';location.reload();};
if(location.hash==='#restart'){location.hash='';menu.style.display='none';} // skip the menu after Restart

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(menu.style.display!=='none'||msg.style.display!=='none'){requestAnimationFrame(loop);return;} // paused: freeze everything
  let f=-jy,s=jx;
  const len=Math.hypot(f,s);if(len>1){f/=len;s/=len;}
  const sp=(sprintOn?9:5)*dt,sy_=Math.sin(p.yaw),cy=Math.cos(p.yaw);
  const dx=(-sy_*f+cy*s)*sp,dz=(-cy*f-sy_*s)*sp;
  if(!hits(p.x+dx,p.z)&&!hitCrew(p.x+dx,p.z,R))p.x+=dx;
  if(!hits(p.x,p.z+dz)&&!hitCrew(p.x,p.z+dz,R))p.z+=dz;
  cam.position.set(p.x,EYE,p.z);
  cam.rotation.set(p.pitch,p.yaw,0);
  crew.forEach(g=>{
    const u=g.userData;u.timer-=dt;
    if(u.timer<=0){u.moving=Math.random()<0.75;u.dir=Math.random()*6.283;u.timer=1+Math.random()*3;}
    u.chase=false;
    if(u.role==='impostor'){
      const ex=p.x-g.position.x,ez=p.z-g.position.z,d=Math.hypot(ex,ez);
      if(d<6){u.dir=Math.atan2(ex,ez);u.moving=true;u.chase=true;}
      if(d<1.2)die();
    }
    if(!u.moving){g.position.y=0;return;}
    const nx=g.position.x+Math.sin(u.dir)*(u.chase?3:1.6)*dt,nz=g.position.z+Math.cos(u.dir)*(u.chase?3:1.6)*dt;
    let ok=false;
    if(!hits(nx,g.position.z,0.5)&&!hitCrew(nx,g.position.z,0.5,g)){g.position.x=nx;ok=true;}
    if(!hits(g.position.x,nz,0.5)&&!hitCrew(g.position.x,nz,0.5,g)){g.position.z=nz;ok=true;}
    if(!ok)u.timer=0;
    g.rotation.y=u.dir;u.t+=dt*10;g.position.y=Math.abs(Math.sin(u.t))*0.08;
  });
  renderer.render(scene,cam);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
